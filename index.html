<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식단 기록</title>
<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#17262a;--mute:#65767a;--line:#d9e1de;--kcal:#2f6f64;--pro:#d1783a;--sel:#17262a}
@media (prefers-color-scheme:dark){:root{--bg:#101817;--card:#17221f;--ink:#e6efec;--mute:#8ba09b;--line:#27363a;--kcal:#5fb3a2;--pro:#e59a62;--sel:#e6efec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:1.1rem}
button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
button:focus-visible,.d:focus-visible{outline:2px solid var(--kcal);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:.8rem;padding:2px 0}
.d{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:6px;background:none;padding:4px;text-align:left;font-size:.8rem;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.d.empty{border:none;cursor:default}
.d.sel{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.d.today b{text-decoration:underline}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--kcal)}
.bar.over i{background:var(--pro)}
h2{font-size:1.1rem;margin:0 0 12px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tot div{font-size:.85rem;color:var(--mute)}
.tot strong{display:block;font-size:1.25rem;color:var(--ink)}
.tot .bar{margin-top:4px}
.tot .p i{background:var(--pro)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
li .t{flex:0 0 3.2em;color:var(--mute);font-size:.85rem}
li .f{flex:1}
li .n{text-align:right;font-size:.85rem;color:var(--mute);white-space:nowrap}
.note{color:var(--mute);font-size:.85rem;margin-top:8px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mute)}
.week i{display:block;width:100%;background:var(--kcal);border-radius:4px 4px 0 0;min-height:2px}
.empty-msg{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>식단 기록</h1>
  <p class="sub" id="sub"></p>

  <section class="card" aria-label="달력">
    <div class="nav">
      <button id="prev" aria-label="이전 달">이전</button>
      <b id="month"></b>
      <button id="next" aria-label="다음 달">다음</button>
    </div>
    <div class="grid" id="cal"></div>
  </section>

  <section class="card" aria-live="polite">
    <h2 id="dayTitle"></h2>
    <div id="dayBody"></div>
  </section>

  <section class="card">
    <h2>최근 7일 칼로리</h2>
    <div class="week" id="week"></div>
  </section>
</main>

<script>
const DOW = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
let data = {targets:{kcal:2500,protein:150}, days:{}};
const now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let selected = key(now);

function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sum(k, f){ return (data.days[k]||[]).reduce((a,m)=>a+(Number(m[f])||0),0); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderCal(){
  $('month').textContent = view.getFullYear()+'년 '+(view.getMonth()+1)+'월';
  const first = view.getDay();
  const last = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  let h = DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<first;i++) h += '<div class="d empty"></div>';
  for(let d=1; d<=last; d++){
    const k = key(new Date(view.getFullYear(), view.getMonth(), d));
    const kc = sum(k,'kcal');
    const pct = Math.min(100, kc/data.targets.kcal*100);
    const cls = 'd'+(k===selected?' sel':'')+(k===key(now)?' today':'');
    const bar = kc ? '<div class="bar'+(kc>data.targets.kcal?' over':'')+'"><i style="width:'+pct+'%"></i></div>' : '<div></div>';
    h += '<button class="'+cls+'" data-k="'+k+'" aria-label="'+(view.getMonth()+1)+'월 '+d+'일'+(kc?', '+kc+' kcal':'')+'"><b>'+d+'</b>'+bar+'</button>';
  }
  $('cal').innerHTML = h;
  $('cal').querySelectorAll('.d[data-k]').forEach(b=>b.onclick=()=>{selected=b.dataset.k;renderCal();renderDay();});
}

function renderDay(){
  const [y,m,d] = selected.split('-').map(Number);
  $('dayTitle').textContent = m+'월 '+d+'일 ('+DOW[new Date(y,m-1,d).getDay()]+')';
  const meals = data.days[selected]||[];
  if(!meals.length){ $('dayBody').innerHTML = '<p class="empty-msg">이 날은 기록이 없어요. meals.json에 추가하면 여기에 표시돼요.</p>'; return; }
  const kc = sum(selected,'kcal'), pr = sum(selected,'protein');
  const T = data.targets;
  let h = '<div class="tot">'
    + '<div>칼로리<strong>'+kc+' / '+T.kcal+' kcal</strong><div class="bar"><i style="width:'+Math.min(100,kc/T.kcal*100)+'%"></i></div></div>'
    + '<div>단백질<strong>'+pr+' / '+T.protein+' g</strong><div class="bar p"><i style="width:'+Math.min(100,pr/T.protein*100)+'%"></i></div></div>'
    + '</div><ul>';
  meals.forEach(x=>{
    h += '<li><span class="t">'+esc(x.type||'')+'</span><span class="f">'+esc(x.food||'')+(x.memo?'<div class="note">'+esc(x.memo)+'</div>':'')+'</span><span class="n">'+(x.kcal||0)+' kcal<br>'+(x.protein||0)+' g</span></li>';
  });
  $('dayBody').innerHTML = h+'</ul>';
}

function renderWeek(){
  const T = data.targets.kcal; let h='';
  const vals=[];
  for(let i=6;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); vals.push([d,sum(key(d),'kcal')]); }
  const max = Math.max(T, ...vals.map(v=>v[1]));
  vals.forEach(([d,v])=>{ h += '<div><span>'+(v||'')+'</span><i style="height:'+(v/max*100)+'%'+(v>T?';background:var(--pro)':'')+'"></i><span>'+DOW[d.getDay()]+'</span></div>'; });
  $('week').innerHTML = h;
}

$('prev').onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()-1, 1); renderCal(); };
$('next').onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()+1, 1); renderCal(); };

fetch('meals.json').then(r=>r.json()).then(j=>{ data=j; }).catch(()=>{
  $('sub').textContent = 'meals.json을 불러오지 못했어요. 로컬 파일로 열었다면 간단한 서버(python3 -m http.server)로 실행해 주세요.';
}).finally(()=>{
  if(!$('sub').textContent) $('sub').textContent = '하루 목표 '+data.targets.kcal+' kcal · 단백질 '+data.targets.protein+' g';
  renderCal(); renderDay(); renderWeek();
});
</script>
</body>
</html>
